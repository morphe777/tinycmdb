# Publication de l'image, déclenchée par une étiquette de version (v0.1.0, v0.2.0…).
#
# Pas sur chaque poussée vers main, délibérément : une image publiée à chaque commit fait
# de `latest` une cible mouvante, et prive l'étiquette de version de tout sens. On publie
# ce qu'on a décidé de publier.
#
# Construite par GitHub et non à la main depuis un poste : une image poussée manuellement
# n'a aucune provenance vérifiable — personne, y compris soi-même six mois plus tard, ne
# peut dire de quel commit elle sort.
name: Publier l'image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # QEMU pour la construction arm64 : un homelab, ça se termine souvent sur un
      # Raspberry Pi. Les trois images de base (python, trivy, cup) existent dans les
      # deux architectures, sans quoi rien de tout ceci ne serait possible.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub est facultatif : sans la variable DOCKERHUB_USERNAME, tout se publie
      # sur GHCR et le reste est sauté sans échouer.
      - name: Connexion à Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Registres visés
        id: cibles
        run: |
          {
            echo "images<<FIN"
            echo "ghcr.io/${{ github.repository }}"
            if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ]; then
              echo "${{ vars.DOCKERHUB_USERNAME }}/tinycmdb"
            fi
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - name: Étiquettes et métadonnées
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cibles.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TinyCMDB
            org.opencontainers.image.description=A small homelab CMDB and IPAM over Proxmox, Docker, Trivy and Baserow
            org.opencontainers.image.licenses=MIT

      - name: Construire et pousser
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TINYCMDB_COMMIT=${{ github.sha }}
            TINYCMDB_BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
