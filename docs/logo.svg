<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TinyCMDB">
  <!-- Trois lignes d'une table. Les deux premières, sarcelle, sont ce que le collecteur
       découvre ; la dernière, prune et plus courte, ce que vous saisissez. C'est le seul
       propos du projet, et ce sont les deux couleurs de toute la console. -->
  <rect width="64" height="64" rx="14" fill="#0d6b6b"/>
  <rect x="13" y="17" width="38" height="7" rx="3.5" fill="#ffffff" opacity=".95"/>
  <rect x="13" y="28.5" width="38" height="7" rx="3.5" fill="#ffffff" opacity=".5"/>
  <rect x="13" y="40" width="24" height="7" rx="3.5" fill="#b793d3"/>
</svg>
